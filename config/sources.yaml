# Apify (LinkedIn and others). Needs APIFY_TOKEN in .env. Each search is one actor run, billed by Apify.
apify:
  enabled: true
  actor: curious_coder/linkedin-jobs-scraper
  # Trimmed to ≈ $0.30 per click (≈ 150 jobs × $0.002) so the free $5/month allows about 15 clicks.
  # The free GitHub lists and company sites already cover most of LinkedIn; these fill the gaps.
  searches:
    # Google, Meta, Apple and Uber: their own sites can't be read, so search LinkedIn by company id
    - keywords: software engineer OR data scientist OR machine learning
      location: United States
      companyIds: ["1441", "10667", "162479", "1815218"]
      datePosted: pastWeek
      limitPerSource: 60
    # Everyone else in the US, last 24 hours only
    - keywords: software engineer OR data scientist OR machine learning engineer new grad
      location: United States
      datePosted: past24Hours
      limitPerSource: 50
    # India: data / ML / finance, last 24 hours
    - keywords: data scientist OR machine learning engineer OR financial analyst
      location: India
      datePosted: past24Hours
      limitPerSource: 40

# Only keep jobs posted within this many days.
max_age_days: 45

# Employers' own career sites (config/finance_firms.yaml + config/more_companies.yaml): jobs posted in the
# last N days, for these tabs: us = Jobs, india = India, other = Other countries.
company_feeds: true
company_max_age_days: 30
company_regions: [us, india, other]

# Refresh all sources automatically while the portal is running (minutes, 0 = off).
# Apify is excluded from auto-refresh because it costs money; use the "Fetch LinkedIn (Apify)" button.
auto_refresh_minutes: 60

# JobRight AI has no public API, so the portal links out. {q} is replaced with "title company".
jobright_url: https://jobright.ai/jobs/search?value={q}

# README.md "Live snapshot": rewritten after every refresh. If this folder is a git repository with a GitHub
# remote, the portal also commits and pushes README.md (only that file), at most once every N hours.
readme_auto_push: true
readme_push_hours: 6

# Fast lane: these companies' own career sites are re-checked every N minutes (not just hourly), so brand-new
# postings show up quickly and can trigger phone / email alerts (Settings → Phone & email alerts).
fast_lane_minutes: 15
fast_lane: [Microsoft, Amazon, NVIDIA, Netflix, Salesforce, Adobe, LinkedIn, Airbnb, Databricks, Snowflake, Stripe, DoorDash,
            Pinterest, Roblox, Waymo, Datadog, Cloudflare, Anthropic, OpenAI, Coinbase, Robinhood, Palantir, Jane Street,
            Hudson River Trading, JPMorgan Chase, Capital One, Visa, Mastercard, Morgan Stanley, Citi, BlackRock]
