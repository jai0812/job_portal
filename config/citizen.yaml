# The "🇺🇸 US citizen jobs" tab (switched on per user from the Users page).
# A US citizen can apply to every US job, so this tab is the whole US list plus the things that matter only to
# citizens: roles that require citizenship or a clearance, employers that never sponsor, government & defense.
#
# match: names used to recognise the employer in job listings from any source (case-insensitive, whole words;
#        "=Name" means the company name must be exactly that). Default: the name itself.
# url:   the employer's career site, shown as a link on the tab.

