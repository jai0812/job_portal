# Canadian employers, read straight from their own career sites (same feed format as more_companies.yaml).
# All collect Canada only. Big non-tech employers (banks, insurers, retail, energy…) use tech_only: they keep
# software / data / IT roles, plus HR & recruiting roles (any employer's HR roles in Canada are always kept).
# every_hours keeps the 30-minute refresh quick: these are re-checked every 2–3 hours.
# Sources found 2026-10-28 by probing each company's careers page / job board. Cohere, Faire, Instacart, RBC, TD and BMO
# are configured elsewhere (more_companies.yaml / finance_firms.yaml) and pick up their Canadian jobs there.

companies:
  # ---------------- Canadian tech (every role: small and mid-size companies, mostly tech anyway)
  - {name: Wealthsimple, group: Canada tech, regions: [canada], every_hours: 2, feeds: [{type: ashby, board: wealthsimple}]}
