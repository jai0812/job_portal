# Top universities for the "Universities" page. University employers are usually H-1B cap-exempt.
#
# feed types (pulled directly from the university's own job system):
#   workday:         {tenant, wd, site}        e.g. https://yale.wd1.myworkdayjobs.com/external_career_site
#   smartrecruiters: {company}                 e.g. api.smartrecruiters.com/v1/companies/HarvardUniversity
#   oracle:          {host, site}              Oracle HCM Candidate Experience sites
# No feed = link only; jobs from GitHub/Apify/manual that match `match` still show on the page.
# `match` = names used to recognise this university in job listings from other sources.

universities:
- name: Harvard University
  short: Harvard
  careers_url: https://careers.harvard.edu/jobs
  feed: {type: smartrecruiters, company: HarvardUniversity}
  match: [Harvard]
- name: Massachusetts Institute of Technology
  short: MIT
  careers_url: https://hr.mit.edu/jobs/search
  match: [Massachusetts Institute of Technology, MIT, MIT Lincoln Laboratory]
- name: Stanford University
  short: Stanford
  careers_url: https://careersearch.stanford.edu/
  feed: {type: oracle, host: careersearch.stanford.edu, site: stanford}
  match: [Stanford]
- name: Yale University
  short: Yale
  careers_url: https://careers.yale.edu/us/en
  feed: {type: workday, tenant: yale, wd: wd1, site: external_career_site}
  match: [Yale]
- name: Princeton University
  short: Princeton
  careers_url: https://careers.princeton.edu/
  match: [Princeton University, Princeton Plasma Physics]
