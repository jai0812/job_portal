# Finance firms shown in the "Finance firm" column on the Jobs tab.
#
# match:   names used to recognise the firm in job listings from any source (case-insensitive, whole words;
#          "=Name" means the company name must be exactly that, for generic names like =Ramp or =Block)
# exclude: names that contain a match word but are a different company
# uscis:   the firm's legal entity names in the USCIS H-1B Employer Data Hub (FY2023); approvals are summed
# feeds:   the firm's own career site, pulled directly every hour (US, India and other countries). Types:
#            workday {tenant, wd, site} · oracle {host, site_number, site} · greenhouse {board}
#            lever {company} · ashby {board} · phenom {host}
# careers: link for firms whose career site can't be read automatically

segments:
  broad_banks: Broad banks
  global_banks: Global banks
  ib_markets: Investment banking & markets
  asset_managers: Asset managers
  private_markets: Private markets
  hedge_quant: Hedge funds / quant
  market_makers: Market makers / prop trading
  exchanges: Exchanges & market infrastructure
  payments: Payments
  fin_data: Financial data & analytics
  fintech: Fintech & brokers

