<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · SharmaJai Job Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
<form id="login" class="login-card" autocomplete="on">
  <div class="brand"><img src="logo-mark.svg" alt="" width="26" height="26">SharmaJai Job Portal</div>
  <p class="muted">Private. Sign in with the account Jai made for you.</p>
  <label class="lbl" for="username">Username or email</label>
  <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label class="lbl" for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <button class="primary" id="go">Sign in</button>
  <p id="msg" class="flag" role="alert"></p>
</form>
<script src="login.js"></script>
</body>
</html>
